# ========================================
# 필터링 및 타겟 설정 (Hard Filtering)
# ========================================

target_regions:
  - name: "서초구 반포동"
    code: "1165010700"  # 현재 활성: 매매 매물이 있는 아파트 63개 단지 수집
  - name: "강남구 개포동"
    code: "1168010300"  # 현재 활성: 매매 매물이 있는 아파트 24개 단지 수집
  # --- 아래 원하는 지역의 주석(#)을 풀면 수백~수천 개 아파트 단지 수집으로 즉시 확장됩니다 ---
  # - name: "강남구 대치동"
  #   code: "1168010600"
  # - name: "송파구 잠실동"
  #   code: "1171010100"
  # - name: "강남구 압구정동"
  #   code: "1168011000"
  # - name: "서초구 서초동"
  #   code: "1165010800"
  # - name: "용산구 이촌동"
  #   code: "1117012900"

# 예산 필터 (단위: 만원)
budget:
  min_price: 150000     # 15억
  max_price: 350000     # 35억

# 평형 필터 (공급면적 기준, 단위: 평 또는 ㎡ 설정)
area:
  min_pyeong: 25
  max_pyeong: 45

# 급매 기준 설정
drop_rate_threshold:
  percentage: 15.0      # 전고점 대비 15% 이상 하락 시 급매로 간주하여 푸시/크롤링 대상

# ========================================
# 실행 및 시스템 설정
# ========================================
oci:
  # 네이버 부동산 등 API 호출 딜레이 (블락 방지)
  api_request_delay_seconds: 2.5

pc:
  # ML 기반 스코어링 임계값 (이 점수 이상만 텔레그램 프리미엄 알림 등)
  ml_score_threshold: 80.0
  # 로컬 딥 크롤링 헤드리스 브라우저 사용 여부
  use_headless_browser: true
