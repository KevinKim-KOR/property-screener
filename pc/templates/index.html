<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서초·강남 아파트 퀀트 스크리너 v4.2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #080c14;
            --bg-card: rgba(19, 25, 36, 0.75);
            --bg-glass: rgba(15, 23, 42, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(59, 130, 246, 0.3);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.35);
            --accent-green: #10b981;
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-main);
            background-image: radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.08) 0%, transparent 45%),
                              radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.05) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Navbar */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 32px;
            background: rgba(8, 12, 20, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .logo-area { display: flex; align-items: center; gap: 14px; }
        .logo-badge {
            background: linear-gradient(135deg, var(--primary), #06b6d4);
            color: #fff; font-family: var(--font-display); font-weight: 800;
            font-size: 13px; padding: 5px 12px; border-radius: 7px;
            box-shadow: 0 0 12px var(--primary-glow);
        }
        .app-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; }
        .app-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
        .status-pill {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.04); border: 1px solid var(--border);
            padding: 6px 14px; border-radius: 16px; font-size: 12px; color: var(--text-muted);
        }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        /* Container */
        .container { max-width: 1440px; margin: 0 auto; padding: 20px 24px; }

        /* Tabs */
        .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; }
        .tab-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 20px; border: 1px solid var(--border); border-radius: 8px;
            background: transparent; color: var(--text-muted); cursor: pointer;
            font-family: var(--font); font-size: 13px; font-weight: 500;
            transition: all 0.2s;
        }
        .tab-btn.active { background: rgba(59,130,246,0.12); border-color: var(--border-highlight); color: #fff; }
        .tab-count {
            background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 10px;
            font-size: 11px; font-weight: 600;
        }
        .tab-btn.active .tab-count { background: rgba(59,130,246,0.25); color: #93c5fd; }

        /* Filter Bar */
        .filter-bar {
            display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
            padding: 12px 16px; margin-bottom: 16px;
            background: var(--bg-glass); border: 1px solid var(--border); border-radius: 10px;
        }
        .filter-group { display: flex; align-items: center; gap: 6px; }
        .filter-label { font-size: 12px; color: var(--text-dim); font-weight: 600; margin-right: 4px; }
        .btn-filter {
            padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
            background: transparent; color: var(--text-muted); cursor: pointer;
            font-family: var(--font); font-size: 12px; transition: all 0.15s;
        }
        .btn-filter.active { background: rgba(59,130,246,0.15); border-color: var(--border-highlight); color: #fff; }
        .btn-dong {
            padding: 4px 10px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04); color: var(--text-muted); font-size: 11px;
        }
        .btn-dong.active {
            background: rgba(59,130,246,0.25); border-color: var(--primary);
            color: #fff; font-weight: 600;
        }
        .search-box {
            padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.04); color: #fff; font-family: var(--font);
            font-size: 12px; width: 220px; outline: none;
        }
        .search-box:focus { border-color: var(--primary); }
        input[type="range"] { accent-color: var(--primary); width: 120px; }

        /* Table */
        .data-table-wrap {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 10px; overflow: hidden;
        }
        .data-table {
            width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed;
        }
        .data-table thead th {
            background: rgba(15, 23, 42, 0.95);
            padding: 10px 12px; text-align: left;
            font-size: 11px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.3px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap; cursor: pointer; user-select: none;
            position: sticky; top: 0; z-index: 2;
        }
        .data-table thead th:hover { color: #fff; }
        .data-table thead th .sort-arrow { margin-left: 4px; font-size: 10px; opacity: 0.4; }
        .data-table thead th.sorted .sort-arrow { opacity: 1; color: var(--primary); }
        .data-table tbody tr {
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.15s;
        }
        .data-table tbody tr:hover { background: rgba(59, 130, 246, 0.06); }
        .data-table td {
            padding: 9px 12px; white-space: nowrap;
        }
        .data-table td.region { color: var(--text-muted); font-size: 12px; }
        .data-table td.complex-name { font-weight: 600; color: #fff; }
        .data-table td.complex-name a {
            color: inherit; text-decoration: none;
        }
        .data-table td.complex-name a:hover { color: var(--primary); text-decoration: underline; }
        .data-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
        .val-pos { color: var(--accent-green); }
        .val-neg { color: var(--accent-rose); }
        .val-zero { color: var(--text-dim); }
        .badge-new-high {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-radius: 4px;
            vertical-align: middle;
            box-shadow: 0 1px 2px rgba(239, 68, 68, 0.3);
        }
        .empty-msg {
            text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px;
        }

        /* Column Preset Bar & Custom Checkboxes */
        .column-preset-bar {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            margin: 0 16px 12px 16px;
        }
        .preset-buttons {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .preset-label {
            font-size: 12px; font-weight: 600; color: var(--text-muted); margin-right: 4px;
        }
        .btn-preset {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text); padding: 5px 12px;
            border-radius: 6px; font-size: 12px; font-weight: 500;
            cursor: pointer; transition: all 0.15s;
        }
        .btn-preset:hover {
            background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); color: #fff;
        }
        .btn-preset.active {
            background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600;
        }
        .btn-custom-toggle {
            margin-left: auto;
        }
        .custom-cols-panel {
            margin-top: 10px; padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .custom-cols-list {
            display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
        }
        .col-checkbox-item {
            display: flex; align-items: center; gap: 5px;
            font-size: 12px; color: var(--text); cursor: pointer; user-select: none;
        }
        .col-checkbox-item input[type="checkbox"] {
            cursor: pointer; accent-color: var(--primary);
        }
        .col-checkbox-item.fixed-col {
            opacity: 0.55; cursor: not-allowed;
        }

        /* Sticky left columns & Number formatting */
        .data-table-wrap {
            overflow-x: auto;
            position: relative;
        }
        .data-table th.col-region, .data-table td.col-region {
            width: 100px; min-width: 100px; max-width: 100px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            position: sticky; left: 0; z-index: 3;
            background: #0f172a;
        }
        .data-table th.col-complex, .data-table td.col-complex {
            width: 220px; min-width: 220px; max-width: 220px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            position: sticky; left: 100px; z-index: 3;
            background: #0f172a;
        }
        .data-table th.col-area, .data-table td.col-area {
            width: 130px; min-width: 130px; max-width: 130px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            position: sticky; left: 320px; z-index: 3;
            background: #0f172a;
            border-right: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 4px 0 8px -2px rgba(0, 0, 0, 0.4);
        }
        .data-table thead th.col-region,
        .data-table thead th.col-complex,
        .data-table thead th.col-area {
            z-index: 4;
            background: #0f172a;
        }
        .data-table tbody tr:hover td.col-region,
        .data-table tbody tr:hover td.col-complex,
        .data-table tbody tr:hover td.col-area {
            background: #1e293b;
        }
        .data-table td.num, .data-table th.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            padding: 10px 16px;
        }

        /* Excluded table */
        .data-table td.reason { color: var(--text-muted); font-size: 12px; max-width: 360px; white-space: normal; }

        /* Footer */
        .footer-bar {
            margin-top: 20px; padding: 14px 20px;
            background: var(--bg-glass); border: 1px solid var(--border); border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; color: var(--text-dim);
        }
        .footer-bar a { color: var(--primary); cursor: pointer; text-decoration: none; }
        .footer-bar a:hover { text-decoration: underline; }

        /* Responsive */
        @media (max-width: 1024px) {
            .navbar { padding: 12px 16px; }
            .container { padding: 16px; }
            .data-table { font-size: 12px; }
            .data-table td, .data-table thead th { padding: 7px 8px; }
        }
        td.stale-warn { color: #fbbf24; }
        td.stale-bad  { color: #f87171; }
        .my-property-box { background: rgba(59,130,246,0.07); border: 1px solid rgba(59,130,246,0.35);
            border-radius: 10px; margin: 0 0 14px 0; overflow: hidden; }
        .mp-head { display: flex; align-items: center; gap: 10px; padding: 11px 16px; cursor: pointer;
            background: rgba(59,130,246,0.10); }
        .mp-title { font-weight: 700; color: #fff; font-size: 14px; }
        .mp-sub { color: #cbd5e1; font-size: 13px; flex: 1; }
        .mp-toggle { color: #8b95a5; font-size: 12px; }
        .mp-body { padding: 12px 16px 14px; }
        .mp-warn { color: #fbbf24; font-size: 12px; margin-bottom: 10px; line-height: 1.5; }
        .mp-grid { display: flex; flex-wrap: wrap; gap: 10px 26px; }
        .mp-item { min-width: 108px; }
        .mp-label { display: block; color: #8b95a5; font-size: 11px; margin-bottom: 2px; }
        .mp-value { color: #fff; font-size: 14px; font-weight: 600; }
        .mp-value.warn { color: #fbbf24; }
        .mp-value.bad  { color: #f87171; }
        .mp-value.up   { color: #f87171; }
        .mp-value.down { color: #60a5fa; }
        .mp-bench { margin-top: 13px; padding-top: 11px; border-top: 1px solid rgba(59,130,246,0.28); }
        .mp-bench-title { color: #8b95a5; font-size: 11px; margin-bottom: 7px; letter-spacing: .02em; }
        .mp-brow { display: flex; align-items: baseline; gap: 10px; padding: 3px 0; flex-wrap: wrap; }
        .mp-blabel  { color: #8b95a5; font-size: 12px; min-width: 108px; }
        .mp-bval    { color: #e2e8f0; font-size: 14px; font-weight: 600; min-width: 74px; }
        .mp-blabel2 { color: #8b95a5; font-size: 12px; min-width: 62px; }
        .mp-bdiff   { font-size: 14px; font-weight: 700; min-width: 78px; }
        .mp-bdiff.up   { color: #f87171; }
        .mp-bdiff.down { color: #60a5fa; }
        .mp-bnote   { color: #94a3b8; font-size: 12px; }
        .mp-bgroup { margin-bottom: 10px; }
        .mp-bgroup:last-child { margin-bottom: 0; }
        .mp-bgroup-title { color: #cbd5e1; font-size: 12px; font-weight: 600; margin: 6px 0 3px; }
        .cap-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            padding: 16px 18px; margin-bottom: 14px; }
        .cap-title { color: #fff; font-size: 14px; font-weight: 700; margin-bottom: 12px; }
        .cap-mine { color: #93c5fd; font-size: 12px; margin-bottom: 12px; line-height: 1.7; }
        .cap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px 16px; }
        .cap-field label { display: block; color: #8b95a5; font-size: 11px; margin-bottom: 4px; }
        .cap-hint { color: #64748b; margin-left: 5px; }
        .cap-actions { margin-top: 12px; }
        .cap-blocked { color: #fbbf24; font-size: 13px; line-height: 1.8; }
        .cap-table { width: 100%; border-collapse: collapse; }
        .cap-table td { padding: 7px 4px; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px; }
        .cap-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; color: #e2e8f0; }
        .cap-table tr.total td { font-weight: 700; color: #fff; border-bottom: none; padding-top: 10px; }
        .cap-msgs { margin-top: 12px; font-size: 12px; line-height: 1.8; }
        .cap-msgs .warn { color: #fbbf24; }
        .cap-msgs .note { color: #94a3b8; }
        .cap-basis { margin-top: 10px; color: #64748b; font-size: 11px; }
        .cap-disclaimer { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06);
            color: #8b95a5; font-size: 11px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo-area">
            <span class="logo-badge">v4.3</span>
            <div>
                <div class="app-title">서초·강남 아파트 퀀트 스크리너</div>
                <div class="app-subtitle">서초구·강남구 24개 법정동 실거래 기반</div>
            </div>
        </div>
        <div class="status-pill">
            <span class="status-dot"></span>
            <span id="updateTime">갱신 중...</span>
        </div>
    </nav>

    <main class="container">
        <!-- Data Reference Date Banner -->
        <div id="dataRefBanner" style="margin-bottom: 16px; padding: 12px 18px; border-radius: 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 13px; flex-wrap: wrap; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 16px;">📅</span>
                <span id="dataRefText" style="font-weight: 500; color: #e2e8f0;">실거래 자료 확인 중...</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <div id="dataRefWarning" style="display: none; font-weight: 600; font-size: 12px; padding: 4px 12px; border-radius: 6px;"></div>
                <span id="refreshResult" style="display: none; font-size: 12px; color: var(--primary); font-weight: 500;"></span>
                <button id="btnRefresh" onclick="startRefresh()" style="padding: 5px 14px; border-radius: 6px; border: 1px solid var(--primary); background: transparent; color: var(--primary); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s;">
                    🔄 최신 자료 가져오기
                </button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tabActive" onclick="switchTab('active')">
                <span>적격 매물</span>
                <span class="tab-count" id="activeCountBadge">0</span>
            </button>
            <button class="tab-btn" id="tabExcluded" onclick="switchTab('excluded')">
                <span>제외 매물</span>
                <span class="tab-count" id="excludedCountBadge">0</span>
            </button>
            <button class="tab-btn" id="tabCapacity" onclick="switchTab('capacity')">
                <span>매수 여력</span>
            </button>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar" id="filterBar">
            <div class="filter-group">
                <span class="filter-label">지역</span>
                <button class="btn-filter active" onclick="setRegionFilter('all')" id="btnRegAll">전체</button>
                <button class="btn-filter" onclick="setRegionFilter('서초')" id="btnRegSeocho">서초구</button>
                <button class="btn-filter" onclick="setRegionFilter('강남')" id="btnRegGangnam">강남구</button>
            </div>
            <div class="filter-group">
                <span class="filter-label">평형</span>
                <button class="btn-filter active" onclick="setPyeongFilter('all')" id="btnPyAll">전체</button>
                <button class="btn-filter" onclick="setPyeongFilter('A59')" id="btnPy59">25평형</button>
                <button class="btn-filter" onclick="setPyeongFilter('A84')" id="btnPy84">34평형</button>
                <button class="btn-filter" onclick="setPyeongFilter('A114')" id="btnPy114">44평형+</button>
            </div>
            <div class="filter-group">
                <span class="filter-label">금액</span>
                <input type="number" step="any" min="0" id="priceMin" placeholder="최소" oninput="onPriceChange()" style="width: 58px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: #fff; padding: 3px 6px; font-size: 12px; text-align: right;">
                <span style="color: #8b95a5; font-size: 12px;">억 ~</span>
                <input type="number" step="any" min="0" id="priceMax" placeholder="최대" oninput="onPriceChange()" style="width: 58px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: #fff; padding: 3px 6px; font-size: 12px; text-align: right;">
                <span style="color: #8b95a5; font-size: 12px;">억</span>
                <span id="priceLabel" style="color: #fff; font-size: 12px; font-weight: 600;">전체</span>
                <button class="btn-filter" id="btnPriceReset" onclick="resetPriceFilter()" style="padding: 2px 8px; font-size: 11px;">초기화</button>
            </div>
            <div class="filter-group">
                <input type="text" class="search-box" id="searchInput" placeholder="단지명 검색..." oninput="applyFilters()">
            </div>
            <div class="filter-group">
                <button class="btn-filter" id="btnToggleCond" onclick="toggleCondPanel()" style="background: rgba(59, 130, 246, 0.15); border: 1px solid var(--primary); color: #fff; font-weight: 600;">🔍 조건 필터 ▼</button>
            </div>
            <div class="filter-group" id="dongFilterGroup" style="width: 100%; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.08);">
                <span class="filter-label">법정동</span>
                <button class="btn-filter" onclick="selectAllDongs()" style="background: rgba(255,255,255,0.12); color: #fff;">전체 선택</button>
                <button class="btn-filter" onclick="clearAllDongs()" style="background: rgba(255,255,255,0.06); color: #ccc;">전체 해제</button>
                <div id="dongButtonsList" style="display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-left: 6px;"></div>
            </div>
            <!-- Collapsible Condition Filters Panel -->
            <div id="condFilterPanel" style="display: none; width: 100%; margin-top: 8px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); flex-wrap: wrap; gap: 8px; align-items: center;">
                <span class="filter-label" style="color: var(--primary); font-weight: 600; margin-right: 4px;">상세 조건</span>
                <div class="cond-item" style="display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);">
                    <span style="font-size: 12px; color: #cbd5e1; font-weight: 500;">초과하락</span>
                    <input type="number" step="any" id="condExcessDrop" class="cond-input" placeholder="-" oninput="onCondChange()" style="width: 60px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: #fff; padding: 3px 6px; font-size: 12px; text-align: right;">

    <script>
        let allProperties = [];
        let excludedProperties = [];
        let activeTab = 'active';
        let regionFilter = 'all';
        let pyeongFilter = 'all';
        // 금액 필터: 만원 단위로 보관한다(화면 입력은 '억').
        // null 이면 그쪽 끝은 제한 없음.
        let minPriceFilter = null;
        let maxPriceFilter = null;
        let currentSort = { key: 'excess_drop_rate', dir: 'desc' };
        let selectedDongs = new Set();

        function initSelectedDongs(defaultDongs = []) {
            const saved = localStorage.getItem('screener_selected_dongs');
            if (saved) {
                try {
                    const arr = JSON.parse(saved);
                    if (Array.isArray(arr)) {
                        selectedDongs = new Set(arr);
                        return;
                    }
                } catch(e) {}
            }
            selectedDongs = new Set(defaultDongs);
        }

        function saveSelectedDongs() {
            localStorage.setItem('screener_selected_dongs', JSON.stringify(Array.from(selectedDongs)));
        }

        function getDongGu(item) {
            const dong = item.dong_name || item.region_name || '';
            return item.gu_name || (['내곡동','신원동','양재동','방배동','우면동','서초동','반포동','잠원동'].includes(dong) ? '서초구' : '강남구');
        }

        function getVisibleDongsList() {
            const dongSet = new Set();
            allProperties.forEach(item => {
                const dong = item.dong_name || item.region_name || '';
                if (!dong) return;
                const gu = getDongGu(item);
                if (regionFilter !== 'all') {
                    if (regionFilter === '서초' && gu !== '서초구' && !(item.region_name || '').includes('서초')) return;
                    if (regionFilter === '강남' && gu !== '강남구' && !(item.region_name || '').includes('강남')) return;
                }
                dongSet.add(dong);
            });
            return Array.from(dongSet);
        }

        function renderDongButtons() {
            const container = document.getElementById('dongButtonsList');
            if (!container) return;

            const dongCounts = {};
            allProperties.forEach(item => {
                const dong = item.dong_name || item.region_name || '';
                if (!dong) return;
                dongCounts[dong] = (dongCounts[dong] || 0) + 1;
            });

            const dongs = getVisibleDongsList().sort((a, b) => a.localeCompare(b, 'ko'));
            let html = '';
            dongs.forEach(dong => {
                const cnt = dongCounts[dong] || 0;
                if (cnt <= 0) return;
                const activeCls = selectedDongs.has(dong) ? 'active' : '';
                html += `<button class="btn-filter btn-dong ${activeCls}" onclick="toggleDong('${dong}')">${dong} (${cnt})</button>`;
            });
            container.innerHTML = html;
        }

        function toggleDong(dong) {
            if (selectedDongs.has(dong)) {
                selectedDongs.delete(dong);
            } else {
                selectedDongs.add(dong);
            }
            saveSelectedDongs();
            renderDongButtons();
            applyFilters();
        }

        function selectAllDongs() {
            getVisibleDongsList().forEach(dong => selectedDongs.add(dong));
            saveSelectedDongs();
            renderDongButtons();
            applyFilters();
        }

        function clearAllDongs() {
            getVisibleDongsList().forEach(dong => selectedDongs.delete(dong));
            saveSelectedDongs();
            renderDongButtons();
            applyFilters();
        }

        function updateDataRefBanner(data) {
            const banner = document.getElementById('dataRefBanner');
            const textEl = document.getElementById('dataRefText');
            const warnEl = document.getElementById('dataRefWarning');
            if (!banner || !textEl || !warnEl) return;

            const refDate = data.data_ref_date;
            const daysAgo = data.data_ref_days_ago;

            if (!refDate || daysAgo == null) {
                // 사유가 있으면 함께 보여준다. 조용히 사라지면 원인을 알 수 없다.
                textEl.textContent = data.data_ref_error
                    ? ('실거래 자료 기준일 확인 불가 — ' + data.data_ref_error)
                    : '실거래 자료 기준일을 확인할 수 없습니다.';
                textEl.style.color = '#f87171';
                return;
            }
            textEl.style.color = '';

            const parts = refDate.split('-');
            const y = parts[0];
            const m = parseInt(parts[1], 10);
            const d = parseInt(parts[2], 10);
            const daysStr = daysAgo === 0 ? '오늘' : `${daysAgo}일 전`;

            textEl.textContent = `실거래 자료 ${y}년 ${m}월 ${d}일 기준 · ${daysStr}`;

            if (daysAgo > 30) {
                banner.style.background = 'rgba(248, 113, 113, 0.1)';
                banner.style.borderColor = 'rgba(248, 113, 113, 0.5)';
                textEl.style.color = '#f87171';
                warnEl.style.display = 'inline-block';
                warnEl.style.background = 'rgba(248, 113, 113, 0.2)';
                warnEl.style.color = '#f87171';
                warnEl.style.border = '1px solid rgba(248, 113, 113, 0.4)';
                warnEl.textContent = '자료가 오래되었습니다. 갱신이 필요합니다.';
            } else if (daysAgo > 7) {
                banner.style.background = 'rgba(251, 191, 36, 0.08)';
                banner.style.borderColor = 'rgba(251, 191, 36, 0.4)';
                textEl.style.color = '#fbbf24';
                warnEl.style.display = 'none';
            } else {
                banner.style.background = 'rgba(255, 255, 255, 0.04)';
                banner.style.borderColor = 'var(--border)';
                textEl.style.color = '#e2e8f0';
                warnEl.style.display = 'none';
            }
        }

        async function startRefresh() {
            const btn = document.getElementById('btnRefresh');
            const resultEl = document.getElementById('refreshResult');
            btn.disabled = true;
            btn.innerHTML = '⏳ 가져오는 중...';
            btn.style.opacity = '0.6';
            resultEl.style.display = 'none';

            try {
                const res = await fetch('/api/refresh', { method: 'POST' });
                const data = await res.json();
                if (!data.success) {
                    resultEl.textContent = data.message;
                    resultEl.style.display = 'inline';
                    resultEl.style.color = '#f87171';
                    btn.innerHTML = '🔄 최신 자료 가져오기';
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    return;
                }

                // 폴링: 상태를 3초마다 체크
                const pollInterval = setInterval(async () => {
                    try {
                        const statusRes = await fetch('/api/status');
                        const status = await statusRes.json();
                        btn.innerHTML = '⏳ ' + (status.progress_msg || '처리 중...');

                        if (!status.is_crawling) {
                            clearInterval(pollInterval);
                            btn.innerHTML = '🔄 최신 자료 가져오기';
                            btn.disabled = false;
                            btn.style.opacity = '1';
                            resultEl.style.display = 'inline';

                            if (status.error) {
                                // 실패를 성공처럼 보이게 하지 않는다.
                                // 과거에는 progress_msg 에 오류 문구가 담겨도 '✓' 가 붙었다.
                                resultEl.textContent = '✕ 실패: ' + status.error;
                                resultEl.style.color = '#f87171';
                                // 갱신되지 않았으므로 새로고침하지 않는다.
                            } else {
                                resultEl.textContent = '✓ ' + (status.progress_msg || '완료');
                                resultEl.style.color = 'var(--primary)';
                                // 2초 후 전체 새로고침으로 기준일·테이블 갱신
                                setTimeout(() => location.reload(), 2000);
                            }
                        }
                    } catch (e) {
                        // 폴링 에러 무시
                    }
                }, 3000);
            } catch (e) {
                resultEl.textContent = '네트워크 오류';
                resultEl.style.display = 'inline';
                resultEl.style.color = '#f87171';
                btn.innerHTML = '🔄 최신 자료 가져오기';
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }

        async function initDashboard() {
            initColumns();
            try {
                const res = await fetch('/api/properties');
                const data = await res.json();
                allProperties = data.properties || [];
                excludedProperties = data.excluded_properties || [];
                initSelectedDongs(getVisibleDongsList());
                document.getElementById('activeCountBadge').textContent = allProperties.length;
                document.getElementById('excludedCountBadge').textContent = excludedProperties.length;
                document.getElementById('updateTime').textContent =
                    '갱신: ' + (data.last_updated || '-');
                updateDataRefBanner(data);
                updateFooter();
                renderDongButtons();
                loadCondFilters();
                loadPriceFilter();
                applyFilters();
                loadMyProperty();
            } catch(e) {
                document.getElementById('tableBody').innerHTML =
                    '<tr><td colspan="10" class="empty-msg">데이터를 불러올 수 없습니다.</td></tr>';
            }
        }

        function updateFooter() {
            const total = allProperties.length + excludedProperties.length;
            const shown = allProperties.length;
            const excluded = excludedProperties.length;
            document.getElementById('footerSummary').innerHTML =
                `서초구·강남구 아파트 실거래 기준 · 대상 단지 ${total}곳 중 ${shown}곳 표시 · ${excluded}곳 제외 <a onclick="switchTab('excluded')">[제외 목록 보기]</a>`;
            const now = new Date();
            const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0'), d = String(now.getDate()).padStart(2,'0');
            document.getElementById('footerDate').textContent = `${y}년 ${m}월 ${d}일`;
        }

        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('tabActive').classList.toggle('active', tab === 'active');
            document.getElementById('tabExcluded').classList.toggle('active', tab === 'excluded');
            document.getElementById('tabCapacity').classList.toggle('active', tab === 'capacity');

            // 매수 여력은 입력 항목이 많아 매물 표와 같은 화면에 두지 않는다.
            const isCapacity = (tab === 'capacity');
            ['filterBar', 'myPropertyBox', 'condSummaryBar', 'columnPresetBar'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = isCapacity ? 'none' : '';
            });
            const tableWrap = document.querySelector('.data-table-wrap');
            if (tableWrap) tableWrap.style.display = isCapacity ? 'none' : '';
            const capPane = document.getElementById('capacityPane');
            if (capPane) capPane.style.display = isCapacity ? 'block' : 'none';
            if (isCapacity) { loadCapacityInputs(); onCapacityInput(); return; }

            const presetBar = document.getElementById('columnPresetBar');
            if (presetBar) presetBar.style.display = (tab === 'active') ? 'block' : 'none';
            // Reset sort for excluded tab
            if (tab === 'excluded') currentSort = { key: 'gate_reason_kr', dir: 'asc' };
            else currentSort = { key: 'excess_drop_rate', dir: 'desc' };
            applyFilters();
        }

        function setRegionFilter(v) {
            regionFilter = v;
            document.querySelectorAll('#btnRegAll,#btnRegSeocho,#btnRegGangnam').forEach(b => b.classList.remove('active'));
            if (v === 'all') document.getElementById('btnRegAll').classList.add('active');
            else if (v === '서초') document.getElementById('btnRegSeocho').classList.add('active');
            else document.getElementById('btnRegGangnam').classList.add('active');

            const visibleDongs = getVisibleDongsList();
            const hasAnySelected = visibleDongs.some(d => selectedDongs.has(d));
            if (!hasAnySelected) {
                visibleDongs.forEach(d => selectedDongs.add(d));
                saveSelectedDongs();
            }

            renderDongButtons();
            applyFilters();
        }

        function setPyeongFilter(v) {
            pyeongFilter = v;
            document.querySelectorAll('#btnPyAll,#btnPy59,#btnPy84,#btnPy114').forEach(b => b.classList.remove('active'));
            if (v === 'all') document.getElementById('btnPyAll').classList.add('active');
            else if (v === 'A59') document.getElementById('btnPy59').classList.add('active');
            else if (v === 'A84') document.getElementById('btnPy84').classList.add('active');
            else document.getElementById('btnPy114').classList.add('active');
            applyFilters();
        }

        // '억' 입력 -> 만원 단위. 빈칸이면 null(제한 없음).
        function parseEok(id) {
            const raw = (document.getElementById(id).value || '').trim();
            if (raw === '') return null;
            const v = parseFloat(raw);
            if (!isFinite(v) || v < 0) return null;
            return Math.round(v * 10000);
        }

        function updatePriceLabel() {
            const label = document.getElementById('priceLabel');
            const fmt = v => (v / 10000).toFixed(1).replace(/\.0$/, '') + '억';
            if (minPriceFilter === null && maxPriceFilter === null) label.textContent = '전체';
            else if (minPriceFilter !== null && maxPriceFilter !== null)
                label.textContent = fmt(minPriceFilter) + ' ~ ' + fmt(maxPriceFilter);
            else if (maxPriceFilter !== null) label.textContent = fmt(maxPriceFilter) + ' 이하';
            else label.textContent = fmt(minPriceFilter) + ' 이상';
        }

        function onPriceChange() {
            minPriceFilter = parseEok('priceMin');
            maxPriceFilter = parseEok('priceMax');
            // 최소 > 최대로 입력하면 아무것도 안 나와 사용자가 이유를 모른다.
            // 값을 바꾸지 않고 표시로만 알린다.
            const swapped = (minPriceFilter !== null && maxPriceFilter !== null
                             && minPriceFilter > maxPriceFilter);
            const warn = document.getElementById('priceLabel');
            updatePriceLabel();
            if (swapped) {
                warn.textContent = '최소가 최대보다 큽니다';
                warn.style.color = '#f87171';
            } else {
                warn.style.color = '#fff';
            }
            localStorage.setItem('screener_price_filter',
                JSON.stringify({min: document.getElementById('priceMin').value,
                                max: document.getElementById('priceMax').value}));
            applyFilters();
        }

        function resetPriceFilter() {
            document.getElementById('priceMin').value = '';
            document.getElementById('priceMax').value = '';
            onPriceChange();
        }

        function loadPriceFilter() {
            try {
                const saved = JSON.parse(localStorage.getItem('screener_price_filter') || '{}');
                if (saved.min) document.getElementById('priceMin').value = saved.min;
                if (saved.max) document.getElementById('priceMax').value = saved.max;
            } catch (e) { /* 저장값이 깨졌으면 무시하고 빈 필터로 시작 */ }
            minPriceFilter = parseEok('priceMin');
            maxPriceFilter = parseEok('priceMax');
            updatePriceLabel();
        }

        function matchPyeongFilter(itemAreaType, filterVal) {
            if (filterVal === 'all') return true;
            if (!itemAreaType) return false;
            if (itemAreaType === filterVal) return true;
            if (filterVal === 'A59') {
                return itemAreaType === 'A59' || itemAreaType === 'A40' || (itemAreaType.startsWith('A') && parseInt(itemAreaType.substring(1), 10) < 70);
            }
            if (filterVal === 'A84') {
                const val = parseInt(itemAreaType.substring(1), 10);
                return itemAreaType === 'A84' || (itemAreaType.startsWith('A') && val >= 70 && val < 100);
            }
            if (filterVal === 'A114') {
                const val = parseInt(itemAreaType.substring(1), 10);
                return itemAreaType === 'A114' || itemAreaType === 'A135P' || (itemAreaType.startsWith('A') && val >= 100);
            }
            return false;
        }

        function applyFilters() {
            const query = (document.getElementById('searchInput').value || '').toLowerCase();
            const sourceList = activeTab === 'active' ? allProperties : excludedProperties;

            const filtered = sourceList.filter(item => {
                if (regionFilter !== 'all') {
                    const gu = getDongGu(item);
                    if (regionFilter === '서초' && gu !== '서초구' && !(item.region_name || '').includes('서초')) return false;
                    if (regionFilter === '강남' && gu !== '강남구' && !(item.region_name || '').includes('강남')) return false;
                }
                const dong = item.dong_name || item.region_name || '';
                if (!selectedDongs.has(dong)) return false;
                if (pyeongFilter !== 'all' && !matchPyeongFilter(item.area_type, pyeongFilter)) return false;
                if (query && !(item.complex_name || '').toLowerCase().includes(query)) return false;
                const priceVal = item.median_price_3m || item.asking_price || 0;
                if (priceVal > 0) {
                    if (minPriceFilter !== null && priceVal < minPriceFilter) return false;
                    if (maxPriceFilter !== null && priceVal > maxPriceFilter) return false;
                }
                if (!matchCondFilters(item)) return false;
                return true;
            });
            updateCondSummary(filtered.length);
            sortAndRender(filtered);
        }

        function getCondVal(id) {
            const el = document.getElementById(id);
            if (!el || el.value === '' || el.value == null) return null;
            const v = parseFloat(el.value);
            return isNaN(v) ? null : v;
        }

        function matchCondFilters(item) {
            const excessDrop = getCondVal('condExcessDrop');
            if (excessDrop !== null) {
                if (item.excess_drop_rate == null || item.excess_drop_rate === '') return false;
                if (Number(item.excess_drop_rate) < excessDrop) return false;
            }
            const jeonse = getCondVal('condJeonse');
            if (jeonse !== null) {
                if (item.jeonse_ratio == null || item.jeonse_ratio === '') return false;
                if (Number(item.jeonse_ratio) < jeonse) return false;
            }
            const vol = getCondVal('condVol');
            if (vol !== null) {
                if (item.volume_ratio == null || item.volume_ratio === '') return false;
                if (Number(item.volume_ratio) < vol) return false;
            }
            const tradeCnt = getCondVal('condTradeCnt');
            if (tradeCnt !== null) {
                if (item.trade_count_12m == null || item.trade_count_12m === '') return false;
                if (Number(item.trade_count_12m) < tradeCnt) return false;
            }
            const academies = getCondVal('condAcademies');
            if (academies !== null) {
                if (item.academies_count == null || item.academies_count === '') return false;
                if (Number(item.academies_count) < academies) return false;
            }
            const subway = getCondVal('condSubway');
            if (subway !== null) {
                if (item.subway_dist_m == null || item.subway_dist_m === '') return false;
                if (Number(item.subway_dist_m) > subway) return false;
            }
            const age = getCondVal('condAge');
            if (age !== null) {
                if (item.age_years == null || item.age_years === '') return false;
                if (Number(item.age_years) > age) return false;
            }
            return true;
        }

        function getActiveCondCount() {
            const ids = ['condExcessDrop', 'condJeonse', 'condVol', 'condTradeCnt', 'condAcademies', 'condSubway', 'condAge'];
            let cnt = 0;
            ids.forEach(id => {
                if (getCondVal(id) !== null) cnt++;
            });
            return cnt;
        }

        function updateCondSummary(filteredCount) {
            const cnt = getActiveCondCount();
            const textEl = document.getElementById('condSummaryText');
            const barEl = document.getElementById('condSummaryBar');
            if (textEl) {
                textEl.textContent = `조건 ${cnt}개 적용 · ${filteredCount}곳 표시`;
            }
            if (barEl) {
                if (cnt > 0) {
                    barEl.style.background = 'rgba(59, 130, 246, 0.15)';
                    barEl.style.borderColor = 'var(--primary)';
                } else {
                    barEl.style.background = 'rgba(255, 255, 255, 0.04)';
                    barEl.style.borderColor = 'var(--border)';
                }
            }
        }

        function saveCondFilters() {
            const ids = ['condExcessDrop', 'condJeonse', 'condVol', 'condTradeCnt', 'condAcademies', 'condSubway', 'condAge'];
            const vals = {};
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) vals[id] = el.value;
            });
            localStorage.setItem('screener_cond_filters', JSON.stringify(vals));
        }

        function loadCondFilters() {
            const saved = localStorage.getItem('screener_cond_filters');
            if (saved) {
                try {
                    const vals = JSON.parse(saved);
                    for (const id in vals) {
                        const el = document.getElementById(id);
                        if (el && vals[id] !== undefined) {
                            el.value = vals[id];
                        }
                    }
                } catch(e) {}
            }
            const panelOpen = localStorage.getItem('screener_cond_panel_open') === 'true';
            const panel = document.getElementById('condFilterPanel');
            const btn = document.getElementById('btnToggleCond');
            if (panel && btn) {
                if (panelOpen) {
                    panel.style.display = 'flex';
                    btn.innerHTML = '🔍 조건 필터 ▲';
                } else {
                    panel.style.display = 'none';
                    btn.innerHTML = '🔍 조건 필터 ▼';
                }
            }
        }

        function onCondChange() {
            saveCondFilters();
            applyFilters();
        }

        function resetCondFilters() {
            const ids = ['condExcessDrop', 'condJeonse', 'condVol', 'condTradeCnt', 'condAcademies', 'condSubway', 'condAge'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = '';
            });
            saveCondFilters();
            applyFilters();
        }

        function toggleCondPanel() {
            const panel = document.getElementById('condFilterPanel');
            const btn = document.getElementById('btnToggleCond');
            if (!panel || !btn) return;
            if (panel.style.display === 'none') {
                panel.style.display = 'flex';
                btn.innerHTML = '🔍 조건 필터 ▲';
                localStorage.setItem('screener_cond_panel_open', 'true');
            } else {
                panel.style.display = 'none';
                btn.innerHTML = '🔍 조건 필터 ▼';
                localStorage.setItem('screener_cond_panel_open', 'false');
            }
        }

        function sortAndRender(list) {
            const k = currentSort.key;
            const dir = currentSort.dir === 'asc' ? 1 : -1;
            list.sort((a, b) => {
                let va = a[k], vb = b[k];
                if (va == null) va = '';
                if (vb == null) vb = '';
                if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
                return String(va).localeCompare(String(vb), 'ko') * dir;
            });
            renderTable(list);
        }

        function doSort(key) {
            if (currentSort.key === key) {
                currentSort.dir = currentSort.dir === 'desc' ? 'asc' : 'desc';
            } else {
                currentSort.key = key;
                currentSort.dir = 'desc';
            }
            applyFilters();
        }

        function fmtEok(val) {
            if (!val || val <= 0) return '';
            return (val / 10000).toFixed(1) + '억';
        }

        function fmtPctP(val) {
            if (val == null || val === '' || val === 0) return '';
            const s = val > 0 ? '+' + val.toFixed(1) : val.toFixed(1);
            return s + '%p';
        }

        function fmtM(val) {
            if (val == null || val === '') return '';
            const pct = val * 100.0;
            const s = pct > 0 ? '+' + pct.toFixed(1) : pct.toFixed(1);
            return s + '%';
        }

        function fmtDropRate(val) {
            if (val == null || val === '') return '';
            if (val === 0) return '0.0%';
            const actual = -val;
            const s = actual > 0 ? '+' + actual.toFixed(1) : actual.toFixed(1);
            return s + '%';
        }

        function fmtVol(val) {
            if (val == null || val === '') return '';
            if (val === 0 || val < 0.001) return '거래 없음';
            return val.toFixed(1) + '배';
        }

        function fmtJeonse(val) {
            if (val == null || val === '') return '';
            return val.toFixed(1) + '%';
        }

        function pctClass(val) {
            if (val > 0) return 'val-pos';
            if (val < 0) return 'val-neg';
            return 'val-zero';
        }

        // 네이버 부동산 링크
        //
        // complex_code 를 URL 에 붙이면 안 된다. 이 값은 국토부 실거래에서 만든
        // 해시(MOLIT_11680_...)라 네이버에서 통하지 않고, 네이버는 모르는 코드를
        // 조용히 버린 뒤 기본 지도를 띄운다. 그래서 어느 단지를 눌러도 같은 곳이
        // 열렸다. 네이버 단지 번호를 제대로 붙이려면 크롤러 실연동이 필요하다
        // (설계서 §9 항목 17~19).
        //
        // 그때까지는 '법정동 + 단지명' 검색으로 보낸다. 단지를 특정하면 해당 단지
        // 페이지로 이동하고, 못 하면 그 지역 지도가 열린다. 어느 쪽이든 엉뚱한
        // 기본 지도보다는 낫다.
        function naverSearchQuery(item) {
            const name = String(item.complex_name || '')
                .replace(/\([^)]*\)/g, ' ')   // 괄호 제거: '현대3차(61~64동)' -> '현대3차'
                .replace(/[^\w가-힣\s]/g, ' ') // 특수문자 제거
                .replace(/\s+/g, ' ').trim();
            if (!name) return '';
            const dong = String(item.region_name || '').trim();
            return (dong ? dong + ' ' : '') + name;
        }

        function naverSearchUrl(item) {
            const q = naverSearchQuery(item);
            if (!q) return '';
            return 'https://new.land.naver.com/search?sk=' + encodeURIComponent(q);
        }

        // 최근거래일: 'YYYY-MM-DD' -> 'YY.MM.DD (N일 전)'
        function fmtDealDate(v) {
            if (!v) return '';
            const s = String(v);
            const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (!m) return s;
            const days = Math.floor((Date.now() - new Date(+m[1], +m[2] - 1, +m[3]).getTime()) / 86400000);
            if (days < 0) return s.slice(2);
            return s.slice(2) + ' (' + days + '일)';
        }

        // 오래될수록 눈에 띄게. 거래가 뜸한 단지는 '최근 거래가'의 신뢰도가 낮다.
        function dealDateClass(v) {
            if (!v) return '';
            const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (!m) return '';
            const days = Math.floor((Date.now() - new Date(+m[1], +m[2] - 1, +m[3]).getTime()) / 86400000);
            if (days > 180) return 'stale-bad';
            if (days > 90) return 'stale-warn';
            return '';
        }

        // 가격 기준: 최근 거래가가 어느 기간 창의 중위값인지.
        // 3개월 창에 거래가 3건 미만이면 6개월 -> 12개월로 넓혀 계산한다.
        // 창이 넓을수록 '최근 시세'라기 어렵고, 하락률도 그만큼 오래된 기준과의 비교다.
        function fmtPriceWindow(v) {
            const map = { '3M': '3개월', '6M': '6개월', '12M': '12개월' };
            return map[String(v || '')] || '';
        }

        function priceWindowClass(v) {
            if (v === '12M') return 'stale-bad';
            if (v === '6M') return 'stale-warn';
            return '';
        }

        // ── 보유 주택 ───────────────────────────────────────────
        // 매물 표와 같은 색상 규칙을 쓴다(가격 기준·최근거래일).
        // 값이 없는 줄은 통째로 숨긴다(C13). 대체 문구나 0 으로 채우지 않는다.
        function toggleMyProperty() {
            const body = document.getElementById('mpBody');
            const open = body.style.display !== 'none';
            body.style.display = open ? 'none' : 'block';
            document.getElementById('mpToggle').textContent = open ? '▶' : '▼';
            localStorage.setItem('screener_mp_open', open ? 'false' : 'true');
        }

        async function loadMyProperty() {
            let d;
            try {
                const res = await fetch('/api/my_property');
                d = await res.json();
            } catch (e) { return; }
            if (!d || !d.configured) return;

            capMineData = d;
            const box = document.getElementById('myPropertyBox');
            box.style.display = 'block';

            const cfg = d.config || {};
            const areaTxt = cfg.exclusive_area ? ('34평 / ' + cfg.exclusive_area + '㎡') : '';
            const dongTxt = [cfg.dong ? cfg.dong + '동' : '', cfg.floor ? cfg.floor + '층' : '',
                             cfg.type_label ? cfg.type_label + '타입' : ''].filter(Boolean).join(' ');
            document.getElementById('mpSub').textContent =
                ['영등포구 ' + (d.region_name || ''), d.complex_name || '', areaTxt, dongTxt]
                .filter(Boolean).join('  ·  ');

            const grid = document.getElementById('mpGrid');
            if (!d.found) {
                grid.innerHTML = '<div class="mp-item"><span class="mp-value warn">'
                    + '실거래 자료에서 이 단지를 찾지 못했습니다.</span></div>';
            } else {
                const items = [];
                const push = (label, value, cls) => {
                    if (value === null || value === undefined || value === '') return;  // C13
                    items.push('<div class="mp-item"><span class="mp-label">' + label
                        + '</span><span class="mp-value ' + (cls || '') + '">' + value + '</span></div>');
                };
                push('최근 거래가', d.median_price_3m != null ? d.median_price_3m.toFixed(2) + '억' : null);
                push('가격 기준', fmtPriceWindow(d.price_window),
                     (priceWindowClass(d.price_window) || '').replace('stale-', ''));
                push('최근거래일', fmtDealDate(d.last_deal_date),
                     (dealDateClass(d.last_deal_date) || '').replace('stale-', ''));
                push('전고점', d.peak_price != null
                    ? d.peak_price.toFixed(2) + '억' + (d.peak_date ? ' (' + d.peak_date + ')' : '') : null);
                push('하락률', d.drop_rate != null ? '-' + d.drop_rate.toFixed(1) + '%' : null);
                push('전세가율', d.jeonse_ratio != null ? d.jeonse_ratio.toFixed(1) + '%' : null);
                ['m3', 'm6', 'm12'].forEach(k => {
                    const v = d[k];
                    if (v == null) return;
                    push(k.toUpperCase(), (v > 0 ? '+' : '') + v.toFixed(1) + '%', v > 0 ? 'up' : (v < 0 ? 'down' : ''));
                });
                push('거래 건수', d.trade_count_12m != null ? d.trade_count_12m + '건' : null);
                grid.innerHTML = items.join('');
            }

            renderBenchmark(d);

            const open = localStorage.getItem('screener_mp_open') !== 'false';
            document.getElementById('mpBody').style.display = open ? 'block' : 'none';
            document.getElementById('mpToggle').textContent = open ? '▼' : '▶';
        }

        // 반포·잠원 대비 격차. 매물 표를 따로 보지 않아도 방향이 보여야 한다.
        // 평형대(25/30)별로 나눠 보여준다 — 이주할 평형을 고르는 판단에 쓴다.
        // 표본이 모자란 그룹은 통째로 숨긴다(C13). 추정치로 채우지 않는다.
        function renderBenchmark(d) {
            const box = document.getElementById('mpBench');
            const b = d && d.found ? d.benchmark : null;
            if (!b || !b.groups || !b.groups.length) { box.style.display = 'none'; return; }

            const blocks = [];
            b.groups.forEach(g => {
                const rows = [];
                const row = (label, val, diffLabel, diff, note, cls) =>
                    rows.push('<div class="mp-brow">'
                        + '<span class="mp-blabel">' + label + '</span>'
                        + '<span class="mp-bval">' + val + '</span>'
                        + '<span class="mp-blabel2">' + diffLabel + '</span>'
                        + '<span class="mp-bdiff ' + (cls || '') + '">' + diff + '</span>'
                        + '<span class="mp-bnote">' + (note || '') + '</span>'
                        + '</div>');

                if (g.median_price != null && d.median_price_3m != null) {
                    const diff = d.median_price_3m - g.median_price;
                    const pct = g.median_price ? Math.abs(diff) / g.median_price * 100 : null;
                    const note = pct == null ? ''
                        : '(내 집이 ' + pct.toFixed(0) + '% ' + (diff < 0 ? '낮음' : '높음') + ')';
                    row('중위 거래가', g.median_price.toFixed(2) + '억', '가격 차이',
                        (diff >= 0 ? '+' : '') + diff.toFixed(2) + '억', note,
                        diff < 0 ? 'down' : 'up');
                }
                if (g.median_m12 != null && d.m12 != null) {
                    const gap = d.m12 - g.median_m12;
                    const note = gap > 0 ? '(내 집이 더 올랐음 · 격차 좁혀지는 중)'
                              : (gap < 0 ? '(반포가 더 올랐음 · 격차 벌어지는 중)' : '(차이 없음)');
                    row('중위 M12', (g.median_m12 > 0 ? '+' : '') + g.median_m12.toFixed(1) + '%',
                        '흐름 차이', (gap >= 0 ? '+' : '') + gap.toFixed(1) + '%p', note,
                        gap > 0 ? 'up' : (gap < 0 ? 'down' : ''));
                }
                if (!rows.length) return;
                blocks.push('<div class="mp-bgroup">'
                    + '<div class="mp-bgroup-title">' + g.label + ' · ' + g.complex_count + '곳 기준</div>'
                    + rows.join('') + '</div>');
            });

            if (!blocks.length) { box.style.display = 'none'; return; }
            document.getElementById('mpBenchTitle').textContent = '반포·잠원 대비';
            document.getElementById('mpBenchRows').innerHTML = blocks.join('');
            box.style.display = 'block';
        }

        // ── 매수 여력 (Phase 1: 매도 내역) ──────────────────────
        // 필수 입력이 비면 결과를 만들지 않는다. 부분 결과나 추정치를 보여주지 않는다.
        const CAP_FIELDS = [
            ['capSalePrice',   'sale_price'],
            ['capAcqPrior',    'acq_price_prior'],
            ['capRightValue',  'right_value'],
            ['capContribution','contribution'],
            ['capSupplyPrice', 'member_supply_price'],
            ['capNecessary',   'necessary_expense'],
            ['capMortgage',    'mortgage_balance'],
            ['capHoldPrior',   'hold_rate_prior'],
            ['capLivePrior',   'live_rate_prior'],
            ['capHoldContrib', 'hold_rate_contrib'],
            ['capLiveContrib', 'live_rate_contrib'],
        ];

        const won = v => (v == null) ? '' : Number(v).toLocaleString('ko-KR') + '원';
        const eok = v => (v == null) ? '' : (Number(v) / 100000000).toFixed(2) + '억';

        function collectCapacityInputs() {
            const out = {};
            CAP_FIELDS.forEach(([id, key]) => {
                const el = document.getElementById(id);
                out[key] = el ? el.value.trim() : '';
            });
            return out;
        }

        function saveCapacityInputs() {
            // 개인 자금 정보다. 브라우저에만 두고 저장소나 서버에 남기지 않는다.
            try { localStorage.setItem('screener_capacity_inputs',
                JSON.stringify(collectCapacityInputs())); } catch (e) {}
        }

        function loadCapacityInputs() {
            let saved = {};
            try { saved = JSON.parse(localStorage.getItem('screener_capacity_inputs') || '{}'); }
            catch (e) { saved = {}; }
            CAP_FIELDS.forEach(([id, key]) => {
                const el = document.getElementById(id);
                if (el && !el.value && saved[key]) el.value = saved[key];
            });
            renderCapacityMine();
        }

        function resetCapacityInputs() {
            CAP_FIELDS.forEach(([id]) => { const el = document.getElementById(id); if (el) el.value = ''; });
            try { localStorage.removeItem('screener_capacity_inputs'); } catch (e) {}
            onCapacityInput();
        }

        // 내 집 최근 실거래를 참고값으로 보여준다. 입력값을 덮어쓰지 않는다.
        let capMineData = null;
        function renderCapacityMine() {
            const el = document.getElementById('capMine');
            if (!el) return;
            if (!capMineData || !capMineData.found) { el.textContent = ''; return; }
            const lines = ['최근 실거래(3개월 중위)　' + capMineData.median_price_3m.toFixed(2) + '억'];
            const inp = document.getElementById('capSalePrice');
            if (inp && !inp.value) {
                lines.push('매도 예상가가 비어 있습니다. 위 값을 참고해 직접 입력하세요.');
            }
            el.innerHTML = lines.join('<br>');
        }

        let capTimer = null;
        function onCapacityInput() {
            saveCapacityInputs();
            renderCapacityMine();
            clearTimeout(capTimer);
            capTimer = setTimeout(runCapacityCalc, 250);
        }

        async function runCapacityCalc() {
            const blocked = document.getElementById('capBlocked');
            const result = document.getElementById('capResult');
            let d;
            try {
                const res = await fetch('/api/purchase_capacity/sale', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(collectCapacityInputs())
                });
                d = await res.json();
            } catch (e) {
                result.style.display = 'none';
                blocked.style.display = 'block';
                blocked.textContent = '계산을 요청하지 못했습니다. 잠시 후 다시 시도하세요.';
                return;
            }

            if (!d.ok) {
                result.style.display = 'none';
                blocked.style.display = 'block';
                if (d.reason === 'missing_input') {
                    blocked.innerHTML = '아래 항목을 입력하면 결과가 표시됩니다.<br>· '
                        + d.missing.join('<br>· ');
                } else {
                    blocked.textContent = '계산할 수 없습니다 — ' + (d.message || '');
                }
                return;
            }

            blocked.style.display = 'none';
            result.style.display = 'block';

            const b = d.breakdown;
            const rows = [
                ['매도가', b.sale_price],
                ['중개보수', -b.brokerage_fee],
                ['양도소득세', -b.total_tax],
                ['대출 상환', -b.mortgage_balance],
            ];
            let html = rows.map(([k, v]) =>
                '<tr><td>' + k + '</td><td>' + won(v) + '</td></tr>').join('');
            html += '<tr class="total"><td>매도 순현금</td><td>' + won(b.net_cash)
                 + '　(' + eok(b.net_cash) + ')</td></tr>';
            document.getElementById('capTable').innerHTML = html;

            const msgs = [];
            (d.warnings || []).forEach(w => msgs.push('<div class="warn">⚠ ' + w + '</div>'));
            (d.notes || []).forEach(n => msgs.push('<div class="note">· ' + n + '</div>'));
            document.getElementById('capMsgs').innerHTML = msgs.join('');
            document.getElementById('capBasis').textContent =
                '적용 기준 ' + (d.basis.capital_gains_effective_from || '')
                + ' · ' + (d.basis.capital_gains_source || '');
        }

        const OPTIONAL_COLUMNS = [
            { key: 'median_price_3m', label: '최근 거래가', group: 'price', num: true },
            { key: 'price_window', label: '가격 기준', group: 'price', num: false },
            { key: 'last_deal_date', label: '최근거래일', group: 'price', num: true },
            { key: 'peak_price', label: '전고점', group: 'price', num: true },
            { key: 'peak_date', label: '전고점 시점', group: 'price', num: true },
            { key: 'drop_rate', label: '하락률', group: 'price', num: true },
            { key: 'excess_drop_rate', label: '초과하락', group: 'price', num: true },
            { key: 'jeonse_ratio', label: '전세가율', group: 'price', num: true },
            { key: 'm3', label: 'M3', group: 'flow', num: true },
            { key: 'm6', label: 'M6', group: 'flow', num: true },
            { key: 'm12', label: 'M12', group: 'flow', num: true },
            { key: 'trade_count_12m', label: '거래 건수', group: 'flow', num: true },
            { key: 'volume_ratio', label: '거래량비', group: 'flow', num: true },
            { key: 'build_year_str', label: '연식', group: 'complex', num: true },
            { key: 'brand', label: '브랜드', group: 'complex', num: false },
            { key: 'subway_str', label: '역세권', group: 'complex', num: false },
            { key: 'academies_str', label: '학원가', group: 'complex', num: false },
            { key: 'schools_str', label: '학교거리', group: 'complex', num: false },
        ];

        const PRESETS = {
            price: ['median_price_3m', 'price_window', 'last_deal_date', 'peak_price', 'peak_date', 'drop_rate', 'excess_drop_rate', 'jeonse_ratio'],
            flow: ['m3', 'm6', 'm12', 'trade_count_12m', 'volume_ratio'],
            complex: ['build_year_str', 'brand', 'subway_str', 'academies_str', 'schools_str'],
            all: OPTIONAL_COLUMNS.map(c => c.key)
        };

        let visibleColumns = [];

        function initColumns() {
            const saved = localStorage.getItem('screener_visible_cols');
            if (saved) {
                try {
                    visibleColumns = JSON.parse(saved);
                } catch(e) {
                    visibleColumns = PRESETS.price.slice();
                }
            } else {
                visibleColumns = PRESETS.price.slice();
            }
            updatePresetButtonsState();
            renderCustomColsCheckboxes();
        }

        function saveVisibleColumns() {
            localStorage.setItem('screener_visible_cols', JSON.stringify(visibleColumns));
            updatePresetButtonsState();
            renderCustomColsCheckboxes();
            applyFilters();
        }

        function applyPreset(presetName) {
            if (PRESETS[presetName]) {
                visibleColumns = PRESETS[presetName].slice();
                saveVisibleColumns();
            }
        }

        function toggleCustomPanel() {
            const panel = document.getElementById('customColsPanel');
            panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
        }

        function updatePresetButtonsState() {
            ['price', 'flow', 'complex', 'all'].forEach(name => {
                const btn = document.getElementById('btnPreset' + name.charAt(0).toUpperCase() + name.slice(1));
                if (btn) {
                    const presetCols = PRESETS[name];
                    const isMatch = presetCols.length === visibleColumns.length &&
                        presetCols.every(k => visibleColumns.includes(k));
                    btn.classList.toggle('active', isMatch);
                }
            });
        }

        function renderCustomColsCheckboxes() {
            const container = document.getElementById('customColsList');
            if (!container) return;
            let html = `
                <label class="col-checkbox-item fixed-col">
                    <input type="checkbox" checked disabled> 지역
                </label>
                <label class="col-checkbox-item fixed-col">
                    <input type="checkbox" checked disabled> 단지명
                </label>
                <label class="col-checkbox-item fixed-col">
                    <input type="checkbox" checked disabled> 평형
                </label>
            `;
            OPTIONAL_COLUMNS.forEach(c => {
                const isChecked = visibleColumns.includes(c.key);
                html += `
                    <label class="col-checkbox-item">
                        <input type="checkbox" onchange="toggleColumn('${c.key}', this.checked)" ${isChecked ? 'checked' : ''}>
                        ${c.label}
                    </label>
                `;
            });
            container.innerHTML = html;
        }

        function toggleColumn(key, checked) {
            if (checked && !visibleColumns.includes(key)) {
                visibleColumns.push(key);
            } else if (!checked) {
                visibleColumns = visibleColumns.filter(k => k !== key);
            }
            saveVisibleColumns();
        }

        function renderTable(list) {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');

            if (activeTab === 'active') {
                const fixedCols = [
                    { key: 'region_name', label: '지역', cls: 'col-region' },
                    { key: 'complex_name', label: '단지명', cls: 'col-complex' },
                    { key: 'area_type_str', label: '평형', cls: 'col-area' },
                ];
                const activeOptionalCols = OPTIONAL_COLUMNS.filter(c => visibleColumns.includes(c.key));
                const cols = fixedCols.concat(activeOptionalCols);

                thead.innerHTML = '<tr>' + cols.map(c => {
                    const isSorted = currentSort.key === c.key;
                    const arrow = isSorted ? (currentSort.dir === 'asc' ? '▲' : '▼') : '▲';
                    return `<th class="${isSorted ? 'sorted' : ''} ${c.num ? 'num' : ''} ${c.cls || ''}" onclick="doSort('${c.key}')">${c.label}<span class="sort-arrow">${arrow}</span></th>`;
                }).join('') + '</tr>';

                if (!list.length) {
                    tbody.innerHTML = `<tr><td colspan="${cols.length}" class="empty-msg">조건에 일치하는 매물이 없습니다.</td></tr>`;
                    return;
                }

                tbody.innerHTML = list.map(item => {
                    const naverUrl = item.naver_link || naverSearchUrl(item);
                    const nameLink = naverUrl ? `<a href="${naverUrl}" target="_blank" rel="noopener">${item.complex_name}</a>` : item.complex_name;
                    const badge = item.is_new_high ? '<span class="badge-new-high">신고가</span>' : '';
                    
                    let rowHtml = `<tr>
                        <td class="region col-region">${item.region_name || ''}</td>
                        <td class="complex-name col-complex">${nameLink}${badge}</td>
                        <td class="col-area">${item.area_type_str || ''}</td>`;
                    
                    activeOptionalCols.forEach(c => {
                        const val = item[c.key];
                        let content = '';
                        let extraClass = c.num ? 'num ' : '';
                        if (c.key === 'median_price_3m' || c.key === 'peak_price') {
                            content = fmtEok(val);
                        } else if (c.key === 'drop_rate') {
                            const dropVal = val || 0;
                            extraClass += pctClass(-dropVal);
                            content = item.is_new_high ? '0.0%' : fmtDropRate(dropVal);
                        } else if (c.key === 'excess_drop_rate') {
                            const exVal = val || 0;
                            extraClass += pctClass(exVal);
                            content = fmtPctP(exVal);
                        } else if (c.key === 'jeonse_ratio') {
                            content = fmtJeonse(val);
                        } else if (c.key === 'm3' || c.key === 'm6' || c.key === 'm12') {
                            const mVal = val;
                            extraClass += pctClass(mVal);
                            content = fmtM(mVal);
                        } else if (c.key === 'trade_count_12m') {
                            content = val ? val + '건' : '';
                        } else if (c.key === 'volume_ratio') {
                            content = fmtVol(val);
                        } else if (c.key === 'last_deal_date') {
                            content = fmtDealDate(val);
                            extraClass += dealDateClass(val);
                        } else if (c.key === 'price_window') {
                            content = fmtPriceWindow(val);
                            extraClass += priceWindowClass(val);
                        } else {
                            content = (val == null) ? '' : val;
                        }
                        rowHtml += `<td class="${extraClass.trim()}">${content}</td>`;
                    });
                    rowHtml += '</tr>';
                    return rowHtml;
                }).join('');
            } else {
                // Excluded tab
                const cols = [
                    { key: 'region_name', label: '지역' },
                    { key: 'complex_name', label: '단지명' },
                    { key: 'area_type_str', label: '평형' },
                    { key: 'gate_reason_kr', label: '제외 사유' },
                ];
                thead.innerHTML = '<tr>' + cols.map(c => {
                    const isSorted = currentSort.key === c.key;
                    const arrow = isSorted ? (currentSort.dir === 'asc' ? '▲' : '▼') : '▲';
                    return `<th class="${isSorted ? 'sorted' : ''}" onclick="doSort('${c.key}')">${c.label}<span class="sort-arrow">${arrow}</span></th>`;
                }).join('') + '</tr>';

                if (!list.length) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-msg">조건에 일치하는 제외 매물이 없습니다.</td></tr>';
                    return;
                }

                tbody.innerHTML = list.map(item => {
                    return `<tr>
                        <td class="region">${item.region_name || ''}</td>
                        <td class="complex-name">${item.complex_name || ''}</td>
                        <td>${item.area_type_str || ''}</td>
                        <td class="reason">${item.gate_reason_kr || ''}</td>
                    </tr>`;
                }).join('');
            }
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
